<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Ofertas Masivo</title>
    <style>
        :root {
            --bg-gray: #f4f4f5;
            --border-color: #e4e4e7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-gray);
            padding: 20px;
            color: #18181b;
        }

        .card {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #71717a;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .controls-row {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            background: #f8fafc;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
        }

        input {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .item-input-card {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #fff;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }

        .buttons-row {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-size: 0.95rem;
        }

        .btn-calc {
            background: #000;
            color: white;
        }

        .btn-print {
            background: #e4e4e7;
            color: #18181b;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .preview-grid img {
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        @media print {
            .no-print { display: none !important; }
            body { padding: 0; background: white; }
            @page { size: A4 portrait; margin: 0; }
            .preview-grid { display: block; }
            .preview-grid img {
                page-break-after: always;
                width: 100vw;
                height: 100vh;
                object-fit: contain;
                border: none;
            }
        }
    </style>
</head>
<body>

    <div class="card no-print">
        <h1>🏷️ Generador Masivo de Ofertas</h1>
        <p class="subtitle">Completá los datos y precios para generar los carteles automáticamente.</p>

        <div class="controls-row">
            <div class="field-group">
                <label>Descuento (%):</label>
                <input type="number" id="descuentoInput" value="10" style="width: 100px;">
            </div>
        </div>

        <label style="margin-bottom: 8px; display: block;">Listado de Productos:</label>
        <div class="grid-inputs" id="contenedorInputs"></div>

        <div class="buttons-row">
            <button class="btn-calc" onclick="generarTodasLasOfertas()">⚡ Generar Ofertas</button>
            <button class="btn-print" onclick="window.print()">🖨️ Imprimir / PDF</button>
        </div>

        <div class="preview-grid" id="previewGrid"></div>
    </div>

    <script>
        const USUARIO_GITHUB = "OrellanoL";
        const REPOSITORIO_GITHUB = "generador-imagenes";

        const URL_MP_LOGO = `https://raw.githubusercontent.com/${USUARIO_GITHUB}/${REPOSITORIO_GITHUB}/main/mplogo.png`;
        const URL_CARREFOUR_LOGO = `https://raw.githubusercontent.com/${USUARIO_GITHUB}/${REPOSITORIO_GITHUB}/main/carrefourexpresslogo.webp`;

        const productos = [
            {
                id: 1,
                titulo: "PAPEL HIGIÉNICO",
                descripcion: "HOJA SIMPLE X 4 U. X 30 MT! HIGIENOL",
                aclaracion: "LLEVANDO 2 UNIDADES C/U",
                fotoUrl: `https://raw.githubusercontent.com/${USUARIO_GITHUB}/${REPOSITORIO_GITHUB}/main/Higienol.jpg`,
                precioDefault: 2750
            },
            {
                id: 2,
                titulo: "GALLETITAS",
                descripcion: "SANDWICH X 3 U X 108 G TRAVIATA",
                aclaracion: "",
                fotoUrl: `https://raw.githubusercontent.com/${USUARIO_GITHUB}/${REPOSITORIO_GITHUB}/main/traviata.webp`,
                precioDefault: 2389
            },
            {
                id: 3,
                titulo: "ARROZ LARGO",
                descripcion: "FINO 00000 X 1 KG CRUCERO",
                aclaracion: "",
                fotoUrl: `https://raw.githubusercontent.com/${USUARIO_GITHUB}/${REPOSITORIO_GITHUB}/main/arrozcrucero.webp`,
                precioDefault: 1280
            }
        ];

        for (let i = productos.length + 1; i <= 30; i++) {
            productos.push({
                id: i,
                titulo: `PRODUCTO ${i}`,
                descripcion: "DESCRIPCIÓN DEL PRODUCTO",
                aclaracion: "",
                fotoUrl: `https://raw.githubusercontent.com/${USUARIO_GITHUB}/${REPOSITORIO_GITHUB}/main/producto_${i}.png`,
                precioDefault: 2000
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            const contenedorInputs = document.getElementById('contenedorInputs');
            if (!contenedorInputs) return;

            productos.forEach((p, index) => {
                contenedorInputs.innerHTML += `
                    <div class="item-input-card">
                        <strong>Item ${p.id}</strong>
                        <input type="text" id="titulo_${index}" value="${p.titulo}" placeholder="Título">
                        <input type="text" id="desc_${index}" value="${p.descripcion}" placeholder="Descripción">
                        <input type="text" id="aclara_${index}" value="${p.aclaracion}" placeholder="Aclaración">
                        <input type="number" id="price_${index}" value="${p.precioDefault}" placeholder="Precio Regular">
                    </div>
                `;
            });
        });

        function cargarImagen(src) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = src;
            });
        }

        async function crearCartelDinámico(pData, precioRegular, pctDescuento) {
            const canvas = document.createElement('canvas');
            canvas.width = 800;
            canvas.height = 980; // Reducido de 1131 a 980 para cortar el sobrante inferior
            const ctx = canvas.getContext('2d');

            const [imgProducto, imgMp, imgCarrefour] = await Promise.all([
                cargarImagen(pData.fotoUrl),
                cargarImagen(URL_MP_LOGO),
                cargarImagen(URL_CARREFOUR_LOGO)
            ]);

            // 1. FONDO AMARILLO COMPLETO
            ctx.fillStyle = "#ffe600";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. ENCABEZADO
            ctx.fillStyle = "#001a72";
            ctx.font = "bold 38px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("HOY JUEVES CON", canvas.width / 2, 55);

            // Logo Mercado Pago
            if (imgMp) {
                const w = 110, h = (imgMp.height / imgMp.width) * w;
                ctx.drawImage(imgMp, (canvas.width / 2) - (w / 2), 65, w, h);
            }

            // 3. RECUADRO BLANCO CENTRAL
            ctx.fillStyle = "#ffffff";
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#00a3e0";
            const rx = 50, ry = 135, rw = 700, rh = 680, radius = 25;
            ctx.beginPath();
            ctx.roundRect(rx, ry, rw, rh, radius);
            ctx.fill();
            ctx.stroke();

            // Logo Carrefour
            if (imgCarrefour) {
                const w = 90; 
                const h = (imgCarrefour.height / imgCarrefour.width) * w;
                const posX = 630;
                ctx.drawImage(imgCarrefour, posX, 150, w, h);
            }

            // 4. IMAGEN DEL PRODUCTO
            if (imgProducto) {
                const imgMaxW = 460;
                const imgMaxH = 320;
                let scale = Math.min(imgMaxW / imgProducto.width, imgMaxH / imgProducto.height);
                let w = imgProducto.width * scale;
                let h = imgProducto.height * scale;
                ctx.drawImage(imgProducto, (canvas.width - w) / 2, 310 - (h / 2), w, h);
            }

            // 5. ACLARACIÓN ("LLEVANDO 2 UNIDADES C/U")
            if (pData.aclaracion) {
                ctx.fillStyle = "#000000";
                ctx.font = "bold 20px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(pData.aclaracion.toUpperCase(), canvas.width / 2, 500);
            }

            // 6. TÍTULO Y DESCRIPCIÓN
            ctx.fillStyle = "#000000";
            ctx.textAlign = "left";

            // Título del Producto
            ctx.font = "bold 26px sans-serif";
            ctx.fillText(pData.titulo, 75, 550);

            // Descripción del Producto
            ctx.font = "20px sans-serif";
            const palabras = pData.descripcion.split(" ");
            let linea = "";
            let y = 585;
            const maxAnchoTexto = 300;

            for (let n = 0; n < palabras.length; n++) {
                let testLinea = linea + palabras[n] + " ";
                let metrics = ctx.measureText(testLinea);
                if (metrics.width > maxAnchoTexto && n > 0) {
                    ctx.fillText(linea, 75, y);
                    linea = palabras[n] + " ";
                    y += 26;
                } else {
                    linea = testLinea;
                }
            }
            ctx.fillText(linea, 75, y);

            // 7. CARTEL ROJO Y PRECIO
            const posXCartel = 400; 
            const anchoCartel = 320; 
            const centroCartel = posXCartel + (anchoCartel / 2); // 560px
            const precioFinal = Math.round(precioRegular * (1 - pctDescuento / 100));

            // Recuadro de Precio Rojo
            ctx.fillStyle = "#e11d48";
            ctx.fillRect(posXCartel, 535, anchoCartel, 140);

            // Precio Oferta ($ grande)
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 78px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("$" + precioFinal.toLocaleString('es-AR'), centroCartel, 635);

            // Precio Regular
            ctx.fillStyle = "#000000";
            ctx.font = "bold 20px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("PRECIO REGULAR $" + precioRegular.toLocaleString('es-AR'), centroCartel, 710);

            // 8. PIE DE PÁGINA (Ajustado exactamente en la franja amarilla inferior)
            ctx.fillStyle = "#000000";
            ctx.font = "bold 22px sans-serif";
            ctx.textAlign = "center";

            ctx.fillText("Abonando con QR desde el celular,", canvas.width / 2, 875);
            ctx.fillText("EXCLUSIVO DINERO EN CUENTA.", canvas.width / 2, 902);
            ctx.fillText("COMPRA MINIMA DE $15000", canvas.width / 2, 929);

            return canvas.toDataURL('image/png');
        }
        
        async function generarTodasLasOfertas() {
            const previewGrid = document.getElementById('previewGrid');
            previewGrid.innerHTML = 'Generando afiches...';

            const pctDescuento = parseFloat(document.getElementById('descuentoInput').value) || 0;
            const fragment = document.createDocumentFragment();

            for (let i = 0; i < productos.length; i++) {
                const pData = {
                    id: productos[i].id,
                    titulo: document.getElementById(`titulo_${i}`).value,
                    descripcion: document.getElementById(`desc_${i}`).value,
                    aclaracion: document.getElementById(`aclara_${i}`).value,
                    fotoUrl: productos[i].fotoUrl
                };
                const precioReg = parseFloat(document.getElementById(`price_${i}`).value) || 0;

                const urlResult = await crearCartelDinámico(pData, precioReg, pctDescuento);
                if (urlResult) {
                    const img = document.createElement('img');
                    img.src = urlResult;
                    fragment.appendChild(img);
                }
            }

            previewGrid.innerHTML = '';
            previewGrid.appendChild(fragment);
        }
    </script>
</body>
</html>
