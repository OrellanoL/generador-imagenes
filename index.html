<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Ofertas Masivo</title>
    <style>
        :root {
            --bg-gray: #f4f4f5;
            --border-color: #e4e4e7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-gray);
            padding: 20px;
            color: #18181b;
        }

        .card {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #71717a;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .controls-row {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            background: #f8fafc;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
        }

        input {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
            max-height: 350px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .item-input {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .item-input label {
            font-size: 0.8rem;
            color: #4b5563;
        }

        .buttons-row {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-size: 0.95rem;
        }

        .btn-calc {
            background: #000;
            color: white;
        }

        .btn-print {
            background: #e4e4e7;
            color: #18181b;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .preview-grid img {
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        @media print {
            .no-print { display: none !important; }
            body { padding: 0; background: white; }
            
            @page {
                size: A4 portrait;
                margin: 0;
            }

            .preview-grid {
                display: block;
            }

            .preview-grid img {
                page-break-after: always;
                width: 100vw;
                height: 100vh;
                object-fit: contain;
                border: none;
            }
        }
    </style>
</head>
<body>

    <div class="card no-print">
        <h1>🏷️ Generador Masivo de Ofertas</h1>
        <p class="subtitle">Ingresá los Precios Regulares. El valor con descuento y los avisos se actualizarán automáticamente.</p>

        <div class="controls-row">
            <div class="field-group">
                <label>Descuento a aplicar (%):</label>
                <input type="number" id="descuentoInput" value="10" style="width: 100px;">
            </div>
        </div>

        <label style="margin-bottom: 8px; display: block;">Precios Regulares por Producto:</label>
        <div class="grid-inputs" id="contenedorInputs"></div>

        <div class="buttons-row">
            <button class="btn-calc" onclick="generarTodasLasOfertas()">⚡ Generar Ofertas</button>
            <button class="btn-print" onclick="window.print()">🖨️ Imprimir / PDF</button>
        </div>

        <div class="preview-grid" id="previewGrid"></div>
    </div>

    <script>
        // CONFIGURACIÓN AJUSTADA A TU REPOSITORIO DE GITHUB:
        const USUARIO_GITHUB = "OrellanoL"; 
        const REPOSITORIO_GITHUB = "generador-imagenes";

        // Genera la lista de tus 30 diapositivas
        const productos = [];
        for (let i = 1; i <= 30; i++) {
            productos.push({
                id: i,
                nombre: `Producto ${i}`,
                urlImagen: `https://raw.githubusercontent.com/${USUARIO_GITHUB}/${REPOSITORIO_GITHUB}/main/Diapositiva_${i}.jpg`
            });
        }

        // Crear dinámicamente las casillas para los 30 precios
        const contenedorInputs = document.getElementById('contenedorInputs');
        productos.forEach((p, index) => {
            contenedorInputs.innerHTML += `
                <div class="item-input">
                    <label>${p.id}. ${p.nombre}</label>
                    <input type="number" id="price_${index}" placeholder="Precio regular" value="2750">
                </div>
            `;
        });

        // Función que superpone el precio en la diapositiva
        function crearCartelOferta(producto, precioRegular, pctDescuento) {
            return new Promise((resolve) => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                const img = new Image();
                img.crossOrigin = "anonymous"; 
                img.src = producto.urlImagen;

                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;

                    // 1. Dibujar la diapositiva original de fondo
                    ctx.drawImage(img, 0, 0);

                    const precioFinal = Math.round(precioRegular * (1 - pctDescuento / 100));

                    // 2. Dibujar Precio Oferta dentro del recuadro
                    ctx.fillStyle = "#1e1b4b";
                    ctx.font = "bold " + (canvas.height * 0.085) + "px sans-serif";
                    ctx.textAlign = "left";
                    ctx.fillText("$" + precioFinal.toLocaleString('es-AR'), canvas.width * 0.52, canvas.height * 0.69);

                    // 3. Dibujar Precio Regular abajo
                    ctx.fillStyle = "#000000";
                    ctx.font = "bold " + (canvas.height * 0.028) + "px sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText("PRECIO REGULAR $" + precioRegular.toLocaleString('es-AR'), canvas.width * 0.60, canvas.height * 0.81);

                    resolve(canvas.toDataURL('image/png'));
                };

                // En caso de error o que una imagen todavía no esté subida, omitir
                img.onerror = () => resolve('');
            });
        }

        async function generarTodasLasOfertas() {
            const previewGrid = document.getElementById('previewGrid');
            previewGrid.innerHTML = 'Generando imágenes...';

            const pctDescuento = parseFloat(document.getElementById('descuentoInput').value) || 0;
            const fragment = document.createDocumentFragment();

            for (let i = 0; i < productos.length; i++) {
                const precioReg = parseFloat(document.getElementById(`price_${i}`).value) || 0;
                const urlResult = await crearCartelOferta(productos[i], precioReg, pctDescuento);

                if (urlResult) {
                    const img = document.createElement('img');
                    img.src = urlResult;
                    fragment.appendChild(img);
                }
            }

            previewGrid.innerHTML = '';
            previewGrid.appendChild(fragment);
        }
    </script>
</body>
</html>
